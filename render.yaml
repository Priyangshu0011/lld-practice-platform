services:
  - type: web
    name: lld-practice-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DB_FILE
        value: /opt/render/project/src/data/lld-practice.sqlite
    disk:
      name: lld-practice-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  - type: web
    name: lld-practice-frontend
    runtime: static
    buildCommand: npm install && npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://lld-practice-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
